name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --name musichub-linux \
            --add-data "web/static:web/static" \
            --add-data "core:core" \
            --add-data "cli:cli" \
            --add-data "config.py:." \
            --hidden-import flask \
            --hidden-import flask_cors \
            --hidden-import requests \
            --hidden-import Crypto \
            --hidden-import mutagen \
            run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musichub-linux
          path: dist/musichub-linux

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/musichub-linux
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name MusicHub `
            --add-data "web/static;web/static" `
            --add-data "core;core" `
            --add-data "cli;cli" `
            --add-data "config.py;." `
            --hidden-import flask `
            --hidden-import flask_cors `
            --hidden-import requests `
            --hidden-import Crypto `
            --hidden-import mutagen `
            run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-exe
          path: dist/MusicHub.exe

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/MusicHub.exe
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -50

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MusicHub.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-apk
          path: MusicHub.apk

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: MusicHub.apk
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source package
        run: |
          git archive --format=tar.gz --output=MusicHub-source.tar.gz HEAD
          ls -lh MusicHub-source.tar.gz

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: MusicHub-source.tar.gz
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
